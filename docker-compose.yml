services:
  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-memora}'
      POSTGRES_USER: '${POSTGRES_USER:-memora}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-memora}'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-memora} -d $${POSTGRES_DB:-memora}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./api
    ports:
      - '8080:8080'
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      # DEV ONLY: default só para `make up` local. Em produção exporte APP_KEY real (ver .env.example).
      APP_KEY: '${APP_KEY:-base64:tUr6OU8s1gqwZ9CP/7It/zMh+cAUbO2duMumgshE5To=}'
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: '5432'
      DB_DATABASE: '${POSTGRES_DB:-memora}'
      DB_USERNAME: '${POSTGRES_USER:-memora}'
      DB_PASSWORD: '${POSTGRES_PASSWORD:-memora}'
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'php -r "exit(@file_get_contents(\"http://localhost:8080/api/health\") ? 0 : 1);"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  queue:
    build:
      context: ./api
    command: php artisan queue:work --sleep=3 --tries=3
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: '${APP_KEY:-base64:tUr6OU8s1gqwZ9CP/7It/zMh+cAUbO2duMumgshE5To=}'
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: '5432'
      DB_DATABASE: '${POSTGRES_DB:-memora}'
      DB_USERNAME: '${POSTGRES_USER:-memora}'
      DB_PASSWORD: '${POSTGRES_PASSWORD:-memora}'
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: postgres:16-alpine
    command: sh -c "while true; do pg_dump -U memora -h pgsql memora > /backups/dump-$$(date +%F_%H%M).sql; sleep 86400; done"
    environment:
      PGPASSWORD: '${POSTGRES_PASSWORD:-memora}'
    volumes:
      - pgbackups:/backups
    depends_on:
      pgsql:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ''
    ports:
      - '3000:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  pgbackups:
