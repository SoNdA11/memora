server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS do Docker (127.0.0.11) + variável no proxy_pass = resolução em runtime.
    # Sem isso, `nginx -t` no build falha ("host not found in upstream api")
    # e o nginx trava no boot se a api ainda não subiu.
    resolver 127.0.0.11 valid=30s;

    # API reversa: o frontend em produção fala com /api sem CORS extra
    location /api/ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Assets com hash: cache longo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:8080;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
