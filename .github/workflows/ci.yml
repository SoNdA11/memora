name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memora_testing
          POSTGRES_USER: memora
          POSTGRES_PASSWORD: memora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql, redis, mbstring, xml
          coverage: none

      - run: composer validate --strict

      - run: composer install --no-interaction --prefer-dist

      - run: composer audit --format=plain --no-interaction

      - run: ./vendor/bin/pint --test

      - run: php artisan migrate:fresh --force && php artisan test
        env:
          APP_KEY: base64:tUr6OU8s1gqwZ9CP/7It/zMh+cAUbO2duMumgshE5To=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: memora_testing
          DB_USERNAME: memora
          DB_PASSWORD: memora
          REDIS_HOST: 127.0.0.1
          CACHE_STORE: array

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker build ./api -t memora-api:ci

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
